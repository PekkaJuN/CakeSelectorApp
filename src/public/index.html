<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cake Selector App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Cake Selector App</h1>

    <div class="tabs">
      <button class="tab-button active" data-tab="products">Products</button>
      <button class="tab-button" data-tab="order-builder">Order Builder</button>
      <button class="tab-button" data-tab="order-history">Order History</button>
    </div>

    <!-- Products Tab -->
    <div id="products-tab" class="tab-content active">
      <h2>Products</h2>

      <div class="add-product-form">
        <input type="text" id="product-name" placeholder="Product name (e.g., Chocolate Cake)" />
        <button id="add-product-btn">Add Product</button>
      </div>
      <div id="product-error" class="error-message"></div>

      <div id="products-list" class="products-list">
        <!-- Products will be rendered here -->
      </div>
    </div>

    <!-- Order Builder Tab -->
    <div id="order-builder-tab" class="tab-content">
      <h2>Order Builder</h2>

      <div class="order-form">
        <div class="form-group">
          <label for="customer-name">Customer Name:</label>
          <input type="text" id="customer-name" placeholder="e.g., Alice Smith" />
        </div>

        <div class="form-group">
          <label for="product-select">Product:</label>
          <select id="product-select">
            <option value="">-- Select a product --</option>
          </select>
        </div>

        <div id="properties-container" class="form-group" style="display: none;">
          <!-- Property dropdowns will be inserted here -->
        </div>

        <button id="add-item-btn" class="btn-primary">Add Item</button>
      </div>
      <div id="order-error" class="error-message"></div>

      <div class="cart-section">
        <h3>Order Items</h3>
        <div id="cart-items" class="cart-items">
          <!-- Items will be rendered here -->
        </div>
        <div class="cart-actions">
          <button id="clear-cart-btn" class="btn-secondary" disabled>Clear Cart</button>
          <button id="save-order-btn" class="btn-primary" disabled>Save Order</button>
        </div>
      </div>
    </div>

    <!-- Order History Tab (placeholder) -->
    <div id="order-history-tab" class="tab-content">
      <h2>Order History</h2>
      <p>Order history and management coming soon...</p>
    </div>

    <!-- Edit Product Modal (hidden by default) -->
    <div id="edit-product-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Product</h3>
          <button class="close-btn" onclick="closeEditProductModal()">&times;</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="edit-product-name">Product Name:</label>
            <input type="text" id="edit-product-name" placeholder="Product name" />
          </div>
          <div id="edit-product-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeEditProductModal()">Cancel</button>
          <button id="save-product-changes-btn" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Delete Product Confirmation Modal (hidden by default) -->
    <div id="delete-product-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Delete Product</h3>
          <button class="close-btn" onclick="closeDeleteProductModal()">&times;</button>
        </div>

        <div class="modal-body">
          <p id="delete-product-message"></p>
          <div id="delete-product-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeDeleteProductModal()">Cancel</button>
          <button id="confirm-delete-btn" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- Add Property Modal (hidden by default) -->
    <div id="add-property-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Add Property</h3>
          <button class="close-btn" onclick="closeAddPropertyModal()">&times;</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="property-name">Property Name:</label>
            <input type="text" id="property-name" placeholder="e.g., Size, Flavor, Coating" />
          </div>
          <div id="add-property-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeAddPropertyModal()">Cancel</button>
          <button id="save-property-btn" class="btn-primary">Add</button>
        </div>
      </div>
    </div>

    <!-- Delete Property Confirmation Modal (hidden by default) -->
    <div id="delete-property-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Delete Property</h3>
          <button class="close-btn" onclick="closeDeletePropertyModal()">&times;</button>
        </div>

        <div class="modal-body">
          <p id="delete-property-message"></p>
          <div id="delete-property-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeDeletePropertyModal()">Cancel</button>
          <button id="confirm-delete-property-btn" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- Add Property Value Modal (hidden by default) -->
    <div id="add-value-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Add Value</h3>
          <button class="close-btn" onclick="closeAddPropertyValueModal()">&times;</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="value-text">Value:</label>
            <input type="text" id="value-text" placeholder="e.g., Small, Medium, Large" />
          </div>
          <div id="add-value-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeAddPropertyValueModal()">Cancel</button>
          <button id="save-value-btn" class="btn-primary">Add</button>
        </div>
      </div>
    </div>

    <!-- Delete Property Value Confirmation Modal (hidden by default) -->
    <div id="delete-value-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Delete Value</h3>
          <button class="close-btn" onclick="closeDeletePropertyValueModal()">&times;</button>
        </div>

        <div class="modal-body">
          <p id="delete-value-message"></p>
          <div id="delete-value-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeDeletePropertyValueModal()">Cancel</button>
          <button id="confirm-delete-value-btn" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- Edit Property Value Modal (hidden by default) -->
    <div id="edit-value-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Value</h3>
          <button class="close-btn" onclick="closeEditPropertyValueModal()">&times;</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="edit-value-text">Value:</label>
            <input type="text" id="edit-value-text" placeholder="e.g., Small, Medium, Large" />
          </div>
          <div id="edit-value-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeEditPropertyValueModal()">Cancel</button>
          <button id="save-value-changes-btn" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Order Edit Modal (hidden by default) -->
    <div id="edit-order-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Order</h3>
          <button class="close-btn" onclick="closeOrderEditModal()">&times;</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="edit-customer-name">Customer Name:</label>
            <input type="text" id="edit-customer-name" placeholder="Customer name" />
          </div>

          <div class="order-items-section">
            <h4>Items</h4>
            <div id="edit-cart-items" class="cart-items">
              <!-- Items will be rendered here -->
            </div>
          </div>

          <div class="form-group">
            <h4>Add New Item</h4>
            <label for="edit-product-select">Product:</label>
            <select id="edit-product-select">
              <option value="">-- Select a product --</option>
            </select>
          </div>

          <div id="edit-properties-container" class="form-group" style="display: none;">
            <!-- Property dropdowns will be inserted here -->
          </div>

          <button id="edit-add-item-btn" class="btn-secondary" style="width: 100%; margin-bottom: 15px;">Add Item</button>

          <div id="edit-order-error" class="error-message"></div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeOrderEditModal()">Cancel</button>
          <button id="save-order-changes-btn" class="btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
